<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>الحلقة الذكية | Smart Halaqa</title>
    <meta name="description" content="منظومة إدارة حلقات وأكاديميات القرآن الكريم" />

    <!-- Favicon & PWA Manifest -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#070B11" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="الحلقة الذكية" />

    <!-- 1. منع إضافات المتصفح من تعديل الألوان تلقائياً -->
    <meta name="darkreader-lock" />
    <meta name="color-scheme" content="dark" />

    <!-- 2. تفريغ الـ Cache تلقائياً عند تحديث رقم الإصدار -->
    <script>
      (function () {
        const CURRENT_VERSION = '1.0.2';
        const savedVersion = localStorage.getItem('app_version');

        if (savedVersion !== CURRENT_VERSION) {
          localStorage.clear();
          sessionStorage.clear();
          localStorage.setItem('app_version', CURRENT_VERSION);
        }
      })();
    </script>

    <!-- Google Fonts: Cairo & Tajawal -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
  </head>
  <body>

    <div id="root"></div>
    
    <script type="module" src="/src/main.jsx"></script>

  </body>
</html>
