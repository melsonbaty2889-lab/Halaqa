<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>الحلقة الذكية | Smart Halaqa</title>
    <meta name="description" content="منظومة إدارة الحلقة الذكية والأكاديميات" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />

    <!-- 1. منع إضافات المتصفح (مثل Dark Reader) من تعديل الألوان تلقائياً -->
    <meta name="darkreader-lock" />
    <meta name="color-scheme" content="dark" />

    <!-- 2. تفريغ الـ Cache تلقائياً عند تحديث رقم الإصدار -->
    <script>
      (function () {
        const CURRENT_VERSION = '1.0.1'; // ارفع هذا الرقم عند كل تحديث جديد للموقع
        const savedVersion = localStorage.getItem('app_version');

        if (savedVersion !== CURRENT_VERSION) {
          localStorage.clear();
          sessionStorage.clear();
          localStorage.setItem('app_version', CURRENT_VERSION);
        }
      })();
    </script>

    <!-- Google Fonts: Cairo & Tajawal مع تسريع التحميل -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">

    <style>
      :root { 
        --bg-color: #070C12; 
        --brand-green: #00c853; 
      }

      *, *::before, *::after {
        box-sizing: border-box;
      }

      html, body { 
        background-color: var(--bg-color); 
        color: #F8FAFC;
        margin: 0; 
        padding: 0;
        width: 100%;
        max-width: 100vw;
        min-height: 100vh;
        overflow-x: hidden;
        font-family: 'Cairo', 'Tajawal', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }

      #root {
        width: 100%;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background-color: var(--bg-color);
      }
    </style>
  </head>
  <body>

    <div id="root"></div>
    
    <script type="module" src="/src/main.jsx"></script>

  </body>
</html>
