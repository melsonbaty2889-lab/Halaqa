<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport"content="width=device-width, initial-scale=1.0"/>
    <title>الحلقة الذكية | Smart Halaqa</title>
    <style>
      /* 🌟 إعادة ضبط الأساسيات لمنع انكماش الشاشة أو السكرول الأفقي */
      :root { 
        --bg-color: #0a0f24; 
        --brand-green: #00c853; 
      }

      *, *::before, *::after {
        box-sizing: border-box;
      }

      html, body { 
        background-color: var(--bg-color); 
        margin: 0; 
        padding: 0;
        width: 100%;
        max-width: 100vw;
        min-height: 100vh;
        overflow-x: hidden; /* منع التمدد الأفقي */
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }

      #root {
        width: 100%;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
    </style>
  </head>
  <body>

    <div id="root"></div>
    
    <script type="module" src="/src/main.jsx"></script>

  </body>
</html>
