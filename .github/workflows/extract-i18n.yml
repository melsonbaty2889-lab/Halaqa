name: Extract i18n Translations

on:
  push:
    branches:
      - stable-app
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --include=dev --legacy-peer-deps

      - name: Ensure Locales Directory Exists
        run: mkdir -p src/locales

      - name: Run i18n Extraction
        run: npx i18next-parser

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(i18n): auto-extract translation keys"
          branch: ${{ github.ref_name }}
          file_pattern: 'src/locales/*.json'
