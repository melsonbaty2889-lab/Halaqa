name: Extract i18n Translations

on:
  push:
    branches:
      - stable-app
  workflow_dispatch:

# إعطاء صلاحيات الكتابة للـ Workflow لتتمكن من رفع التغييرات
permissions:
  contents: write

jobs:
  extract-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Run i18n Extraction
        run: npm run extract-i18n

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(i18n): auto-extract translation keys"
          branch: ${{ github.ref_name }}
          # منع الفشل في حالة عدم وجود تغييرات جديدة لاستخراجها
          skip_dirty_check: false
